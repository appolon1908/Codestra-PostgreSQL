name: PostgreSQL boundary checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check management scripts tests
      - run: python -m ruff format --check management scripts tests
      - run: python -m pytest -q
      - run: python -m openapi_spec_validator openapi.yaml
      - run: python scripts/dev-secrets.py
      - run: docker compose config --quiet
      - run: python tests/integration.py
